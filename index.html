<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Drill for Lucky Blocks | Countdown</title>
  <meta
    name="description"
    content="Countdown for Drill for Lucky Blocks on Roblox."
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #08090c;
      --card: rgba(255, 255, 255, 0.055);
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --muted: #8f939e;
      --accent: #ffd84d;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background:
        radial-gradient(circle at 50% 25%, rgba(255, 216, 77, 0.09), transparent 32%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      width: min(92%, 850px);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: #c7c9cf;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 28px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255, 216, 77, 0.8);
    }

    h1 {
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1;
      letter-spacing: -3px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      margin-bottom: 46px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .time-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 26px 10px;
      backdrop-filter: blur(12px);
    }

    .number {
      display: block;
      font-size: clamp(34px, 7vw, 58px);
      font-weight: 750;
      letter-spacing: -2px;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-top: 7px;
    }

    .footer {
      margin-top: 36px;
      color: #5f626c;
      font-size: 13px;
    }

    #finished {
      display: none;
      padding: 35px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 800;
    }

    @media (max-width: 600px) {
      h1 {
        letter-spacing: -2px;
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .time-box {
        padding: 22px 8px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="badge">
      <span class="dot"></span>
      ROBLOX EVENT
    </div>

    <h1>Drill for <span>Lucky Blocks</span></h1>

    <p class="subtitle">
      Something is coming. Be ready at 5:00 PM Eastern.
    </p>

    <section class="countdown" id="countdown">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>

      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <div id="finished">
      IT'S TIME. ⛏️
    </div>

    <p class="footer">
      DRILL FOR LUCKY BLOCKS • ROBLOX
    </p>
  </main>

  <script>
    /*
      September 25, 2026 at 5:00 PM Eastern Time.

      On September 25, New York is observing EDT (UTC-4),
      so 5:00 PM Eastern = 21:00 UTC.
    */
    const targetTime = new Date("2026-09-25T21:00:00Z").getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");

    const countdownEl = document.getElementById("countdown");
    const finishedEl = document.getElementById("finished");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const now = Date.now();
      const distance = targetTime - now;

      if (distance <= 0) {
        clearInterval(timer);

        countdownEl.style.display = "none";
        finishedEl.style.display = "block";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
      );
      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) / (1000 * 60)
      );
      const seconds = Math.floor(
        (distance % (1000 * 60)) / 1000
      );

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    const timer = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
